# Disposable live Studio repro workflow. Delete after validation.

name: "PR 7410 Local Model Theme Repro"

on:
  push:
    branches:
      - "pr-7410-theme-repro-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    name: "Studio smoke (${{ matrix.os }}, ${{ matrix.browser }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        browser: ["chromium", "firefox", "webkit"]
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps "${{ matrix.browser }}"
          else
            python -m playwright install "${{ matrix.browser }}"
          fi

      - name: Open the Train route on a CPU-only runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # GitHub runners have no GPU, so detect_hardware() leaves CHAT_ONLY True and the
          # root route redirects /studio to /chat, where the styles under test do not exist.
          # Identical on both A/B branches and orthogonal to the CSS this run measures.
          path = Path("studio/backend/utils/hardware/hardware.py")
          text = path.read_text(encoding="utf-8")
          before = text
          text = text.replace("CHAT_ONLY: bool = True", "CHAT_ONLY: bool = False", 1)
          text = text.replace("    CHAT_ONLY = True  # reset", "    CHAT_ONLY = False  # reset", 1)
          if text == before:
              raise SystemExit("hardware.py no longer has the CHAT_ONLY lines this patch targets")
          path.write_text(text, encoding="utf-8")
          print("patched CHAT_ONLY off for this CI run")
          PY

      - name: Install Studio from this branch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_STUDIO_HOME | Out-Null
          & ./install.ps1 --local --no-torch

      - name: Install Studio from this branch (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          bash ./install.sh --local --no-torch

      - name: Launch Studio and run Playwright probe
        shell: bash
        run: |
          python ".github/scripts/pr7410-theme-repro-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-smoke-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
