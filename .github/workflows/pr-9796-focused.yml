name: PR 9796 focused

on:
  pull_request:
    paths:
      - 'studio/frontend/**'
      - '.github/workflows/pr-9796-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escaped-math:
    name: Escaped math (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Focused unit tests
        run: >-
          node --experimental-strip-types --test
          tests/escaped-inline-math.test.ts
          tests/latex-code-regions.test.ts
          tests/latex-list-render.test.ts
          tests/markdown-streaming-scheduling.test.ts
          tests/remend-complete-markdown.test.ts
          tests/streaming-crlf-retention.test.ts
          tests/streaming-latex-corpus.test.ts
          tests/streaming-latex-retro-edit.test.ts
          tests/streaming-render-schedule.test.ts

  build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run build
