# Disposable repro workflow. Delete after validation.

name: "PR 8816 Frontend Checks"

on:
  push:
    branches:
      - "pr-8816-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.17.1"

      - name: "Install frontend dependencies"
        shell: bash
        run: |
          cd studio/frontend && npm ci

      - name: "Run the PR's saved system prompt test"
        shell: bash
        run: |
          cd studio/frontend && node --experimental-strip-types --test tests/saved-system-prompt.test.ts

      - name: "Typecheck the frontend"
        shell: bash
        run: |
          cd studio/frontend && npm run typecheck

      - name: "Biome check the touched files"
        shell: bash
        run: |
          cd studio/frontend && npx biome check src/features/chat/components/saved-system-prompt-picker.tsx src/features/chat/utils/saved-system-prompt.ts src/features/chat/utils/saved-system-prompt-actions.ts tests/saved-system-prompt.test.ts

