# Disposable live Studio repro workflow. Delete after validation.

name: "PR 8844 Shell Selector Focused"

on:
  push:
    branches:
      - "pr-8844-shell-selector-focused-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-commands:
    name: "Shell commands (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci

      - name: Run focused command and persistence tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/agent-command.test.ts tests/settings-panel-prefs.test.ts tests/agents-model-picker.test.ts

      - name: Execute generated Unix command
        if: runner.os != 'Windows'
        working-directory: studio/frontend
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module -e 'import { buildAgentShellCommands, quoteShellArg } from "./src/features/settings/components/agent-command.ts"; const args = `--model ${quoteShellArg("/tmp/My model.gguf", "unix")}`; console.log(buildAgentShellCommands("https://remote.example/", "unix", "claude", args).primary)' > generated-command.txt
          export GENERATED_COMMAND="$(<generated-command.txt)"
          if [ "$RUNNER_OS" = "macOS" ]; then shell_bin=/bin/zsh; else shell_bin=/bin/bash; fi
          result="$($shell_bin -c 'unsloth(){ printf "%s|%s|%s\n" "$UNSLOTH_STUDIO_URL" "$#" "$*"; }; eval "$GENERATED_COMMAND"')"
          test "$result" = "https://remote.example|4|start claude --model /tmp/My model.gguf"

      - name: Execute generated Windows command
        if: runner.os == 'Windows'
        working-directory: studio/frontend
        shell: pwsh
        run: |
          $generated = node --experimental-strip-types --input-type=module -e 'import { buildAgentShellCommands, quoteShellArg } from "./src/features/settings/components/agent-command.ts"; const args = `--model ${quoteShellArg("C:\\Models\\My model.gguf", "windows")}`; console.log(buildAgentShellCommands("https://remote.example/", "windows", "claude", args).primary)'
          function unsloth {
            param([Parameter(ValueFromRemainingArguments = $true)][string[]]$CommandArgs)
            "$env:UNSLOTH_STUDIO_URL|$($CommandArgs.Count)|$($CommandArgs -join ' ')"
          }
          $result = Invoke-Expression $generated
          if ($result -ne 'https://remote.example|4|start claude --model C:\Models\My model.gguf') {
            throw "unexpected command result: $result"
          }

      - name: Run frontend typecheck and strict i18n parity
        if: runner.os == 'Linux'
        working-directory: studio/frontend
        run: |
          npm run typecheck
          npm run i18n:check:strict

  live-studio:
    name: "Studio side-by-side (${{ matrix.os }}, ${{ matrix.browser }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        browser: ["chromium", "firefox", "webkit"]
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps "${{ matrix.browser }}"
          else
            python -m playwright install "${{ matrix.browser }}"
          fi

      - name: Install Studio from this branch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_STUDIO_HOME | Out-Null
          & ./install.ps1 --local --no-torch

      - name: Install Studio from this branch (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          bash ./install.sh --local --no-torch

      - name: Launch Studio and run Playwright probe
        shell: bash
        run: |
          python ".github/scripts/pr-8844-shell-selector-focused-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-side-by-side-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            ${{ github.workspace }}/.studio-live/artifacts/**/*.png
            ${{ github.workspace }}/.studio-live/artifacts/**/*.log
          if-no-files-found: warn
