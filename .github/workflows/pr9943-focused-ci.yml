# Disposable focused CI for upstream PR 9943. Do not merge this branch.

name: "PR 9943 Focused CI"

on:
  push:
    branches:
      - "pr-9943-focused-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: "MCP backend (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: ${{ github.workspace }}/studio/backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout fastapi pydantic structlog fastmcp PyJWT cryptography python-multipart PyYAML
      - name: Run focused MCP tests
        shell: bash
        run: |
          python -m pytest \
            studio/backend/tests/test_mcp_config_import.py \
            studio/backend/tests/test_mcp_servers.py \
            studio/backend/tests/test_mcp_stdio_api_key_gate.py \
            studio/backend/tests/test_mcp_stdio_improvements.py \
            studio/backend/tests/test_mcp_stdio_node_path.py \
            studio/backend/tests/test_mcp_stdio_real_server.py \
            -q

  frontend:
    name: "MCP frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run focused MCP frontend tests
        run: node --experimental-strip-types --test tests/mcp-server-arguments.test.ts
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  live-studio:
    name: "Live stdio MCP (${{ matrix.os }}, ${{ matrix.browser }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "fastmcp>=3.0.2"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps "${{ matrix.browser }}"
          else
            python -m playwright install "${{ matrix.browser }}"
          fi
      - name: Install Studio from this branch on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_STUDIO_HOME | Out-Null
          & ./install.ps1 --local --no-torch
      - name: Install Studio from this branch on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          bash ./install.sh --local --no-torch
      - name: Run real MCP Playwright flow
        shell: bash
        run: python .github/scripts/pr9943-mcp-live-probe.py
      - name: Upload Studio evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-live-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
