# Disposable live Studio repro workflow. Delete after validation.

name: "PR 9922 On Device selection UI"

on:
  push:
    branches:
      - "pr-9922-selection-repro-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    name: "${{ matrix.target.label }} On Device selection"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: after
            repository: mahiatlinux/unsloth
            ref: 509d6c4aa74cfe586257faf99db605f5c0ab2580
            expect_attached: "true"
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/${{ matrix.target.label }}/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.target.label }}
      PR9922_LABEL: ${{ matrix.target.label }}
      PR9922_EXPECT_ATTACHED: ${{ matrix.target.expect_attached }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: harness
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ matrix.target.repository }}
          ref: ${{ matrix.target.ref }}
          path: target
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          python -m playwright install --with-deps chromium

      - name: Audit lockfile
        working-directory: target
        run: python scripts/lockfile_supply_chain_audit.py

      - name: Install exact Studio target
        working-directory: target
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          bash ./install.sh --local --no-torch

      - name: Launch Studio and run Playwright probe
        shell: bash
        run: |
          python "harness/.github/scripts/pr-9922-selection-ui-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-9922-selection-${{ matrix.target.label }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
