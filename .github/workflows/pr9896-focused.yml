# Disposable repro workflow. Delete after validation.

name: "PR 9896 Focused Verification"

on:
  push:
    branches:
      - "pr-9896-focused-repro-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install focused Python dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml ruff 'playwright>=1.45,<2'
          python -m pip install -r studio/backend/requirements/studio.txt

      - name: "Run API monitor and CPU fallback regressions"
        shell: bash
        run: |
          python -m pytest -q studio/backend/tests/test_openai_tool_passthrough.py -k 'streamed_tool_monitor or streamed_legacy_function_monitor or external_stream_clean_eof_flushes_pending_tool_monitor or passthrough_clean_eof_finalizes_monitor'
          python -m pytest -q studio/backend/tests/test_gpu_init_crash_message.py
          ruff check studio/backend/core/inference/api_monitor.py studio/backend/routes/inference.py studio/backend/tests/test_openai_tool_passthrough.py studio/backend/tests/test_gpu_init_crash_message.py

      - name: "Run focused workflow guards"
        shell: bash
        run: |
          python -m pytest -q tests/studio/test_playwright_suites_run_in_ci.py tests/studio/test_chat_ui_shards_cover_everything.py tests/studio/test_ui_shard_engines.py tests/studio/test_playwright_install_avoids_with_deps.py tests/studio/test_indicator_browsers_run_in_parallel.py
          ruff check tests/studio/test_playwright_suites_run_in_ci.py

      - name: "Install frontend with enforced script allowlist"
        shell: bash
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          V=$(npm -v)
          case "$V" in
            11.1[6-9].*|11.[2-9][0-9].*|1[2-9].*) echo "npm $V has allowScripts" ;;
            *) echo "npm $V lacks allowScripts (need >=11.16)"; exit 1 ;;
          esac
          npm --prefix studio/frontend ci --strict-allow-scripts --no-fund --no-audit

      - name: "Run frontend cycle and type checks"
        shell: bash
        run: |
          node --experimental-strip-types --test studio/frontend/tests/module-scope-cycle-safety.test.ts
          npm --prefix studio/frontend run typecheck

      - name: "Run Chromium tool activity probe"
        shell: bash
        run: |
          python -m playwright install chromium
          python tests/studio/playwright_tool_activity.py --json
