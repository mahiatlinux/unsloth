# Disposable repro workflow. Delete after validation.

name: "PR 9893 final focused validation"

on:
  push:
    branches:
      - "pr-9893-cancel-final-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused backend dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 requests 'numpy<3' pytest pytest-asyncio httpx ruff
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"

      - name: "Run health cancellation coverage"
        shell: bash
        run: |
          python -m pytest -q studio/backend/tests/test_llama_cpp_wait_for_health.py

      - name: "Run MTP recovery coverage"
        shell: bash
        run: |
          python -m pytest -q studio/backend/tests/test_tensor_parallel.py -k runtime_recovery

      - name: "Run route and download cancellation coverage"
        shell: bash
        run: |
          python -m pytest -q studio/backend/tests/test_orchestrator_unload_cancel.py -k 'gguf_load_cancellation_includes or cancelled_gguf_download_uses or gguf_load_attempt_does_not_hide or stale_unload_does_not_hide'
          python -m pytest -q studio/backend/tests/test_mtp_drafter_companion.py::test_companion_downloads_forward_the_load_cancel_event studio/backend/tests/test_llama_cpp_mtp_detection.py::test_the_dspark_gate_uses_the_probe_it_is_given

      - name: "Compile changed backend modules"
        shell: bash
        run: |
          python -m py_compile studio/backend/core/inference/llama_cpp.py studio/backend/routes/inference.py

      - name: "Run focused lint"
        shell: bash
        run: |
          ruff check studio/backend/core/inference/llama_cpp.py studio/backend/routes/inference.py studio/backend/tests/test_llama_cpp_wait_for_health.py studio/backend/tests/test_tensor_parallel.py studio/backend/tests/test_orchestrator_unload_cancel.py
