name: pr 10642 native ssh policy
on:
  push:
    branches: [pr-10642-review-ci-20260916]
permissions:
  contents: read
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Souravrajvi0/unsloth
          ref: 8f4b97edc26b9e66c1a2ac15c87dd7194f4a9877
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoped dependencies
        shell: bash
        env:
          UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.cache/python
        run: |
          python -m pip install uv
          uv venv --python python .venv
          uv pip install --python .venv pytest pytest-asyncio pytest-timeout httpx fastapi==0.141.1 pydantic==2.13.4 structlog packaging==26.3 requests pyyaml jinja2 psutil cryptography pyjwt==2.13.0 sqlalchemy python-multipart aiofiles diceware 'huggingface-hub>=1.23,<2'
      - name: Run policy and sandbox checks
        shell: bash
        env:
          UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-test-home
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          PYTHONPATH: ${{ github.workspace }}/studio/backend
        run: |
          if [ -f .venv/Scripts/python.exe ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m pytest studio/backend/tests/test_ssh_policy.py studio/backend/tests/test_sandbox_tools.py studio/backend/tests/test_permission_mode.py -q --tb=short --timeout=90 --junitxml=policy-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-10642-${{ matrix.os }}
          path: policy-results.xml
