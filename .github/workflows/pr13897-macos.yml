# Disposable repro workflow. Delete after validation.

name: "PR 13897 filename macOS"

on:
  push:
    branches:
      - "pr-13897-filename-repro-ci*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest pytest-asyncio pyyaml structlog huggingface-hub requests pydantic fastapi httpx pyjwt

      - name: "Run filename identity probe"
        shell: bash
        run: |
          python .github/repro/pr13897_filename_probe.py

      - name: "Run affected filename and audio tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest -q --tb=short tests/test_gguf_variants_local_resolution.py tests/test_audio_cpp_models.py -k 'audio_page_local_filename_pick_uses_audio_cpp or pickers_exact_filename or filename_selector or exact_filename or loose_file_variant or literal_backslash_filename or exact_filename_spelling'

