# Disposable repro workflow. Delete after validation.

name: "PR 9863 planner focused Windows"

on:
  push:
    branches:
      - "pr-9863-planner-focused-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install focused test dependencies"
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest psutil structlog httpx fastapi pydantic huggingface-hub filelock numpy requests aiofiles gguf PyJWT python-multipart cryptography

      - name: "Run planner and platform simulations"
        shell: pwsh
        run: |
          python -m pytest -q studio/backend/tests/test_offload_cost_model.py studio/backend/tests/test_offload_planner.py studio/backend/tests/test_offload_planner_seam.py studio/backend/tests/test_auto_offload_ctx_platform_matrix.py studio/backend/tests/test_llama_cpp_windows_nvidia_path.py studio/backend/tests/test_amd_apu_unified_memory.py studio/backend/tests/test_llama_cpp_vulkan_probe.py studio/backend/tests/test_metal_explicit_context_guard.py studio/backend/tests/test_metal_never_starts_at_native_context.py

