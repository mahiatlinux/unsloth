# Disposable repro workflow. Delete after validation.

name: "PR 9571 focused Windows"

on:
  push:
    branches:
      - "ci-pr-9571-placement-focused"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: 26ee01cf5678c79f5b6869744b5e429340f5f371

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Verify source commit"
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '26ee01cf5678c79f5b6869744b5e429340f5f371') { throw "wrong source $actual" }

      - name: "Install focused dependencies"
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install pytest pytest-asyncio httpx python-multipart sqlalchemy cryptography pyyaml jinja2 psutil

      - name: "Run model memory tests"
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'studio/backend'
          pytest studio/backend/tests/test_model_memory_settings.py studio/backend/tests/test_rocm_windows_model_memory_9549.py studio/backend/tests/test_server_tuning_flags.py studio/backend/tests/test_load_mode_fit_matrix.py -q
