# Disposable repro workflow. Delete after validation.

name: "PR 9871 Claude routing CI"

on:
  push:
    branches:
      - "pr-9871-routing-ci-final"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3 typer rich pydantic pyyaml nest-asyncio 'huggingface-hub>=0.34.0' 'structlog>=24.1.0' 'click>=8.0' ruff

      - name: "Repository syntax and lint"
        shell: bash
        run: |
          python -m compileall -q -j 0 unsloth unsloth_cli studio tests cli.py unsloth-cli.py
          ruff check unsloth unsloth_cli studio tests cli.py unsloth-cli.py

      - name: "Full Unsloth CLI suite"
        shell: bash
        run: |
          python -m pytest unsloth_cli/tests -q --tb=short

