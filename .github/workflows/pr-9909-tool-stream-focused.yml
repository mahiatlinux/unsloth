# Disposable repro workflow. Delete after validation.

name: "PR 9909 tool stream focused"

on:
  push:
    branches:
      - "pr-9909-tool-stream-focused-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused dependencies"
        shell: bash
        run: |
          python -m pip install pytest structlog huggingface-hub ruff
          cd studio/frontend
          npm ci

      - name: "Run backend tool loop tests"
        shell: bash
        run: |
          PYTHONPATH=studio/backend python -m pytest -q studio/backend/tests/test_studio_tool_loop.py
          ruff check studio/backend/core/inference/studio_tool_loop.py studio/backend/tests/test_studio_tool_loop.py

      - name: "Run frontend tool stream tests"
        shell: bash
        run: |
          cd studio/frontend
          node --test --experimental-strip-types tests/tool-call-delta-index.test.ts tests/codex-tool-card-reconciliation.test.ts tests/studio-tool-history.test.ts tests/chat-generation-reconnect.test.ts tests/chat-runtime-reload-status.test.ts tests/cancelled-turn-history-prune.test.ts
          npm run typecheck

