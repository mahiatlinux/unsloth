# disposable repro workflow; delete after validation

name: "pr 9170 focused validation"

on:
  push:
    branches:
      - "codex/pr-9170-convergence-4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: "linux backend, cli, frontend, browser"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused Python dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio ruff typer==0.27.1 fastapi==0.141.1 uvicorn==0.52.1 pydantic==2.13.4 structlog sqlalchemy cryptography psutil pyyaml jinja2 python-multipart aiofiles httpx requests diceware packaging pyjwt filelock 'huggingface-hub>=1.23.0,<2.0' 'playwright>=1.45,<2'

      - name: "Lint changed Python paths"
        shell: bash
        run: |
          python -m ruff check studio/backend/run.py studio/backend/lan_access.py studio/backend/utils/host_policy.py studio/backend/utils/lan_access_settings.py studio/backend/tests/test_bind_host_policy.py studio/backend/tests/test_lan_access_settings.py studio/backend/tests/test_public_check_optout.py unsloth_cli/_tool_policy.py unsloth_cli/commands/studio.py unsloth_cli/tests/test_studio_password_prompt.py

      - name: "Run focused backend tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest -q tests/test_bind_host_policy.py tests/test_lan_access_settings.py tests/test_public_check_optout.py tests/test_secure_tunnel_gate.py tests/test_startup_banner_loopback.py tests/test_studio_pid_files.py

      - name: "Run focused CLI tests"
        shell: bash
        run: |
          python -m pytest -q unsloth_cli/tests/test_studio_cloudflare_flag.py unsloth_cli/tests/test_studio_password_prompt.py unsloth_cli/tests/test_studio_secure_flag.py unsloth_cli/tests/test_studio_run_parallel_flag.py

      - name: "Install frontend dependencies"
        shell: bash
        run: |
          cd studio/frontend
          npm ci

      - name: "Run focused frontend checks"
        shell: bash
        run: |
          cd studio/frontend
          node --experimental-strip-types --test tests/lan-access-state.test.ts
          npm run typecheck
          npm run build

      - name: "Install Chromium"
        shell: bash
        run: |
          bash .github/scripts/retry-with-apt-lock.sh python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()"; then
            bash .github/scripts/retry-with-apt-lock.sh python -m playwright install-deps chromium
          fi

      - name: "Run focused settings browser check"
        shell: bash
        run: |
          PW_CHUNK_DELAY_MS=120 PW_OUT=logs/pr-9170-settings-tabs.json python tests/studio/playwright_settings_tabs.py

  windows:
    name: "windows backend, cli, frontend"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused Python dependencies"
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio typer==0.27.1 fastapi==0.141.1 uvicorn==0.52.1 pydantic==2.13.4 structlog sqlalchemy cryptography psutil pyyaml jinja2 python-multipart aiofiles httpx requests diceware packaging pyjwt filelock 'huggingface-hub>=1.23.0,<2.0'

      - name: "Run focused backend tests"
        shell: pwsh
        run: |
          Set-Location studio/backend
          python -m pytest -q tests/test_bind_host_policy.py tests/test_lan_access_settings.py tests/test_public_check_optout.py tests/test_secure_tunnel_gate.py tests/test_startup_banner_loopback.py
          python -m pytest -q tests/test_studio_pid_files.py -k 'address_matching or wildcard_alias or port_probe_checks_every_resolved'

      - name: "Run focused CLI tests"
        shell: pwsh
        run: |
          python -m pytest -q unsloth_cli/tests/test_studio_cloudflare_flag.py -k 'run_cloudflare_notice_uses_external_host_policy or run_display_host_delegates_wildcard_aliases or run_silent_uses_ipv6'
          python -m pytest -q unsloth_cli/tests/test_studio_password_prompt.py -k 'should_prompt_password_change_matrix or empty_bind or mapped_wildcard or mixed_family_wildcard or dual_stack_wildcard or ephemeral_multi'
          python -m pytest -q unsloth_cli/tests/test_studio_run_parallel_flag.py -k 'health_poll or load_model_http_payload_for_gpu_memory_mode'

      - name: "Install frontend dependencies"
        shell: pwsh
        run: |
          Set-Location studio/frontend
          npm ci

      - name: "Run focused frontend checks"
        shell: pwsh
        run: |
          Set-Location studio/frontend
          node --experimental-strip-types --test tests/lan-access-state.test.ts
          npm run typecheck
          npm run build
