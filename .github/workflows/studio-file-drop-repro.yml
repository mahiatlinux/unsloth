name: Studio file drop OS verification
on:
  push:
    branches: ['repro/studio-file-drop-os']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: studio/src-tauri -> target
          key: file-drop-repro
      - name: Audit dependencies
        run: python scripts/lockfile_supply_chain_audit.py
      - name: Build and check frontend
        working-directory: studio/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck
          node --experimental-strip-types --test tests/native*.test.ts tests/dataset*.test.ts
      - name: Negative proof of old window routing
        run: python .github/repro/file-drop-negative.py
      - name: Native intake tests and native build
        working-directory: studio/src-tauri
        run: |
          cargo test --locked native_intents::tests -- --nocapture
          cargo build --locked
