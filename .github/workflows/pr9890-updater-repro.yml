name: PR 9890 updater repro

on:
  push:
    branches:
      - pr-9890-updater-repro-ci-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-platform:
    name: updater ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install focused Python test dependencies
        run: >-
          python -m pip install pytest setuptools typer rich pydantic pyyaml
          nest-asyncio structlog click

      - name: Run staged updater and runtime gate tests
        run: >-
          python -m pytest -q
          unsloth_cli/tests/test_studio_update_stage.py
          tests/python/test_studio_runtime_gate.py
          tests/python/test_windows_studio_update_launcher.py

      - name: Run real isolated older-to-newer staging
        run: python .github/scripts/pr9890_updater_e2e.py

      - name: Run shell staged-root contracts
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/sh/test_setup_staged_root.sh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if: false
          workspaces: studio/src-tauri -> target

      - name: Run activation, rollback, ownership, and updater tests
        shell: bash
        run: |
          cargo test --manifest-path studio/src-tauri/Cargo.toml staged_update::tests
          cargo test --manifest-path studio/src-tauri/Cargo.toml desktop_backend_owner::tests
          cargo test --manifest-path studio/src-tauri/Cargo.toml update::tests
          cargo test --manifest-path studio/src-tauri/Cargo.toml pending_activation_requires_a_ready_backend_at_or_above_the_required_version

  updater-frontend:
    name: updater frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit

      - name: Run updater frontend checks
        working-directory: studio/frontend
        run: |
          npm run i18n:check:strict
          npm run typecheck
          node --experimental-strip-types --test tests/update-preparation.test.ts
