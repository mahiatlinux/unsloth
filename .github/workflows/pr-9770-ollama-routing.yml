# Disposable repro workflow. Delete after validation.

name: "PR 9770 Ollama routing"

on:
  push:
    branches:
      - "pr-9770-repro-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx structlog pytest huggingface-hub

      - name: "Run Ollama routing tests"
        shell: bash
        run: |
          cd studio/backend
          python -m pytest tests/test_ollama_reasoning_effort.py -q -W error
