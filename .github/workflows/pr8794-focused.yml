# Disposable repro workflow. Delete after validation.

name: "PR 8794 focused validation"

on:
  push:
    branches:
      - "pr-8794-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install focused backend dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r studio/backend/requirements/studio.txt
          python -m pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests 'numpy<3' pytest pytest-asyncio httpx soundfile librosa transformers
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11' 'torchaudio>=2.4,<2.11'

      - name: "Run native audio backend regressions"
        shell: bash
        run: |
          PYTHONPATH=studio/backend python -m pytest -q studio/backend/tests/test_native_audio.py studio/backend/tests/test_consent_gate.py::TestStructuredFindingsForDialog::test_scan_route_rejects_oversized_audio_metadata_as_bad_request
          PYTHONPATH=studio/backend python -m pytest -q studio/backend/tests/test_control_markup_neutralize_7066.py -k 'tts_breaks_the_active_codec_delimiters or tts_leaves_text_that_is_only_meant_to_be_spoken or tts_unknown_codec_falls_back_to_the_union'

      - name: "Install frontend dependencies"
        shell: bash
        run: |
          cd studio/frontend
          npm ci --ignore-scripts --no-fund --no-audit

      - name: "Typecheck reviewed audio UI"
        shell: bash
        run: |
          cd studio/frontend
          npm run typecheck

      - name: "Validate Playwright evidence contracts"
        shell: bash
        run: |
          git merge-base --is-ancestor 6563d3d29 HEAD
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          root = Path('review-evidence/pr-8794')
          meta = json.loads((root / 'meta.json').read_text())
          before = meta['facts']['BEFORE']
          after = meta['facts']['AFTER']
          assert before['minimax_payload_max_tokens'] == 2048
          assert after['minimax_payload_max_tokens'] == 750
          assert after['minimax_frame_aligned_payload'] == 29
          assert before['higgs_scene_field_count'] == 0
          assert after['higgs_scene_field_count'] == 1
          assert after['higgs_payload_instructions'] == 'Close-mic studio recording in a quiet room'
          assert before['delayed_tts_loads_after_transcribe'] == 1
          assert after['delayed_tts_loads_after_transcribe'] == 0
          assert before['minimax_error_visible'] and after['minimax_error_visible']
          assert before['minimax_audio_players'] == after['minimax_audio_players'] == 1
          assert before['higgs_audio_players'] == after['higgs_audio_players'] == 1
          images = sorted(root.glob('pr8794_pair_*.png'))
          assert len(images) == 4
          for path in images:
              raw = path.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n'
              width, height = struct.unpack('>II', raw[16:24])
              assert width >= 2800 and height >= 900, (path, width, height)
          print('Playwright evidence contracts and four screenshot pairs verified')
          PY
