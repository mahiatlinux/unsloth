# disposable focused workflow

name: "pr 9642 focused validation"

on:
  push:
    branches:
      - "pr-9642-focused-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "targeted validation"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.15.1"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "install frontend dependencies"
        shell: bash
        run: |
          npm ci --prefix studio/frontend

      - name: "test and build recent sorting"
        shell: bash
        run: |
          cd studio/frontend
          node --experimental-strip-types --test tests/hub-inventory-recent-sort.test.ts
          npm run typecheck
          npm run build

      - name: "install backend test dependencies"
        shell: bash
        run: |
          python -m pip install pytest fastapi==0.141.1 pydantic==2.13.4 'huggingface-hub>=1.23.0,<2.0' 'structlog>=24.1.0' httpx ruff

      - name: "test dataset cache timestamps"
        shell: bash
        run: |
          cd studio/backend
          python -m ruff check hub/schemas/datasets.py hub/services/datasets/cache_inventory.py tests/test_dataset_cache_timestamps.py
          python -m pytest -q tests/test_dataset_cache_timestamps.py
