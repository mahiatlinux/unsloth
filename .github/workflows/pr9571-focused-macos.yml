# Disposable repro workflow. Delete after validation.

name: "PR 9571 focused macOS"

on:
  push:
    branches:
      - "ci-pr-9571-placement-focused"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-14"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: 31de44250b408858be063b0661171ad810ace1e1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Verify source commit"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "31de44250b408858be063b0661171ad810ace1e1"

      - name: "Install focused dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install pytest pytest-asyncio httpx python-multipart sqlalchemy cryptography pyyaml jinja2 psutil

      - name: "Run model memory tests"
        shell: bash
        run: |
          PYTHONPATH=studio/backend pytest studio/backend/tests/test_model_memory_settings.py studio/backend/tests/test_rocm_windows_model_memory_9549.py studio/backend/tests/test_server_tuning_flags.py studio/backend/tests/test_load_mode_fit_matrix.py::test_the_cpu_fallback_drops_the_fits_load_mode studio/backend/tests/test_load_mode_fit_matrix.py::test_the_cpu_fallback_keeps_a_load_mode_the_user_asked_for studio/backend/tests/test_load_mode_fit_matrix.py::test_the_crash_path_cpu_fallback_recomputes_the_memory_record studio/backend/tests/test_load_mode_fit_matrix.py::test_the_replayed_cpu_fallback_recomputes_the_memory_record -q
