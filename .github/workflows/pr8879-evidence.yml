name: PR 8879 evidence

# Disposable. Packages the before/after Studio evidence for unslothai/unsloth#8879 as a
# downloadable artifact, so the PR comment carries more than an inline raw URL.

on:
  push:
    branches: [pr-8879-evidence-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List what is being packaged
        run: |
          set -euo pipefail
          cd evidence
          file ./*.png
          sha256sum ./*

      - name: Check the files are what the PR comment claims
        run: python3 check_evidence.py

      - uses: actions/upload-artifact@v4
        with:
          name: pr8879-evidence
          path: evidence/
          if-no-files-found: error
