# disposable repro workflow; delete after validation

name: "PR 9892 Model Discovery"

on:
  push:
    branches:
      - "pr-9892-review-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: "Install focused backend dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth unpdf requests 'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx soundfile librosa ruff
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"
          pip install torchao

      - name: "Run model discovery regression tests"
        shell: bash
        run: |
          PYTHONPATH=studio/backend python -m pytest -q studio/backend/tests/test_async_singleton_access.py studio/backend/tests/test_openai_catalog.py studio/backend/tests/test_openai_models_media.py studio/backend/tests/test_media_auto_switch.py studio/backend/tests/test_audio_unsupported_backend_error.py studio/backend/tests/test_stt_mtmd_sidecar.py studio/backend/tests/test_openai_models_path_leak.py studio/backend/tests/test_local_model_format.py studio/backend/tests/test_cached_gguf_routes.py::test_is_hidden_model_hides_dictation_models

      - name: "Run focused lint"
        shell: bash
        run: |
          ruff check studio/backend/routes/inference.py studio/backend/routes/models.py studio/backend/core/inference/media_model_index.py studio/backend/core/inference/media_locality.py studio/backend/core/inference/stt_sidecar.py studio/backend/tests/test_openai_models_media.py

      - name: "Run chat catalog frontend regression"
        shell: bash
        working-directory: studio/frontend
        run: |
          node --experimental-strip-types --test tests/openai-model-catalog.test.ts
