# Disposable repro workflow. Delete after validation.

name: "PR 12899 Windows Repro"

on:
  push:
    branches:
      - "pr-12899-windows-repro-ci*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Record native Windows toolchain"
        shell: bash
        run: |
          python --version
          node --version
          npm --version
          bash --version

      - name: "Install focused test and browser dependencies"
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2 pytest==9.0.3 playwright==1.55.0
          npm --prefix studio/frontend ci --ignore-scripts --no-fund --no-audit
          python -m playwright install chromium firefox

      - name: "Run Windows guards and concurrent controller cases"
        shell: bash
        run: |
          python -m pytest -q tests/studio/test_ci_parallel_browser_results.py tests/studio/test_workflow_guards_run_unfiltered.py tests/test_source_read_encoding.py

      - name: "Run real concurrent Chromium and Firefox pair twice"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          for repeat in 1 2; do
            failed=0
            chromium_port=$((5500 + repeat * 2))
            firefox_port=$((5501 + repeat * 2))
            PW_ENGINE=chromium PW_PORT=$chromium_port PW_OUT=logs/data_settings_chromium_${repeat}.json VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-data-chromium-$repeat" python tests/studio/playwright_data_settings.py > logs/data_settings_chromium_${repeat}.log 2>&1 &
            chromium_pid=$!
            PW_ENGINE=firefox PW_PORT=$firefox_port PW_OUT=logs/data_settings_firefox_${repeat}.json VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-data-firefox-$repeat" python tests/studio/playwright_data_settings.py > logs/data_settings_firefox_${repeat}.log 2>&1 &
            firefox_pid=$!
            wait "$chromium_pid" || failed=1
            wait "$firefox_pid" || failed=1
            cat logs/data_settings_chromium_${repeat}.log || failed=1
            cat logs/data_settings_firefox_${repeat}.log || failed=1
            test -s logs/data_settings_chromium_${repeat}.json || failed=1
            test -s logs/data_settings_firefox_${repeat}.json || failed=1
            [ "$failed" -eq 0 ] || exit "$failed"
          done

      - name: "Upload Windows browser evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr12899-windows-browser-evidence
          path: logs/data_settings_*
          retention-days: 3
          if-no-files-found: ignore
